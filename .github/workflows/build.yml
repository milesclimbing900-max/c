name: Build jar
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into src folders
        run: |
          mkdir -p src/main/java/com/regionmap/krmap
          mkdir -p src/main/resources/assets/krypton_regionmap/lang
          mv *.java src/main/java/com/regionmap/krmap/
          mv fabric.mod.json src/main/resources/
          mv en_us.json src/main/resources/assets/krypton_regionmap/lang/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: krypton-regionmap
          path: build/libs/*.jar
